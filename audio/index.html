<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            font-family: 'Arial', sans-serif;
            font-style: italic;
            font-weight: bold;
            
        }
        h1{
            text-transform: uppercase;
            text-decoration: underline;
            text-decoration-color: red;
            text-decoration-style:underline;
            text-decoration-thickness: 1px;
            text-indent: 200px;
            text-overflow:ellipsis;
        }
        .lorem{
            border: 1px solid black;
            width:45px;
            text-overflow:ellipsis;
            overflow:hidden;
        }
    </style>
</head>
<body>
    <h1>MY VIDEOS </h1>
    <h2>Video Collection</h2>
    <div>
         <video width="320" height="240" src="1.mp4" controls></video>
         <video width="320" height="240" src="2.mp4" controls></video>
         <video width="320" height="240" src="3.mp4" controls></video>
    </div> 
    <div>
        <h1>my fonts </h1>
        <p>This is a video on fonts </p>
        <p class="lorem">Lorem ipsum dolor sit.</p>
    </div>
</body>
</html>
